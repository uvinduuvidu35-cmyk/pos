<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCK POS - Customers</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, sans-serif;
        }

        body { 
            display: flex; 
            background-color: #f4f6f9; 
            color: #333;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar { 
            width: 260px; 
            background-color: #1a1c23; 
            color: white; 
            height: 100vh; 
            padding: 20px 15px; 
            position: fixed; 
            overflow-y: auto;
        }

        .sidebar h2 { 
            text-align: center; 
            color: #ffffff; 
            margin-bottom: 30px; 
            font-size: 22px;
            letter-spacing: 1px;
        }

        .sidebar ul { 
            list-style: none; 
            padding: 0; 
        }

        .sidebar li { 
            margin: 8px 0; 
        }

        .sidebar a { 
            color: #a0a5b5; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            padding: 12px 15px; 
            border-radius: 8px; 
            font-size: 14px;
            transition: all 0.3s ease; 
        }

        .sidebar a i {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .sidebar a:hover, .sidebar a.active { 
            background: linear-gradient(90deg, #ff7d32, #4a0000); 
            color: white; 
        }

        /* Main Content Styling */
        .main-content { 
            margin-left: 260px; 
            padding: 25px; 
            width: calc(100% - 260px); 
            height: 100vh;
            overflow-y: auto;
        }

        header { 
            background-color: white; 
            padding: 15px 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 24px;
            color: #1a1c23;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .user-profile i {
            font-size: 20px;
            color: #ff7d32;
        }

        /* Content Layout */
        .content-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
        }

        /* Form Card */
        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #1a1c23;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #666;
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #ff7d32;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #ff7d32, #4a0000);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover { opacity: 0.9; }

        .btn-cancel {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
            color: #555;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Table Tools */
        .table-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            padding: 9px 12px 9px 35px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 13px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            vertical-align: middle;
        }

        th {
            background-color: #f8f9fa;
            color: #555;
            font-weight: 600;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-walkin { background-color: #e3f2fd; color: #0d47a1; }
        .badge-regular { background-color: #e8f5e9; color: #1b5e20; }

        .actions-cell {
            display: flex;
            gap: 6px;
        }

        .btn-edit {
            background: #3498db;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-edit:hover { background: #2980b9; }

        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete:hover { background: #c0392b; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>DCK POS</h2>
        <ul>
            <li><a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
            <li><a href="pos.html"><i class="fa-solid fa-cart-shopping"></i> POS</a></li>
            <li><a href="items.html"><i class="fa-solid fa-boxes-stacked"></i> Items</a></li>
            <li><a href="customers.html" class="active"><i class="fa-solid fa-users"></i> Customers</a></li>
            <li><a href="shifts.html"><i class="fa-solid fa-clock-rotate-left"></i> Shifts</a></li>
            <li><a href="expenses.html"><i class="fa-solid fa-wallet"></i> Expenses</a></li>
            <li><a href="cash-drops.html"><i class="fa-solid fa-money-bill-transfer"></i> Cash Drops</a></li>
            <li><a href="stock.html"><i class="fa-solid fa-cubes"></i> Stock</a></li>
            <li><a href="adjustments.html"><i class="fa-solid fa-sliders"></i> Adjustments</a></li>
            <li><a href="transfers.html"><i class="fa-solid fa-arrow-right-arrow-left"></i> Transfers</a></li>
            <li><a href="reports.html"><i class="fa-solid fa-file-invoice"></i> Reports</a></li>
            <li><a href="charts.html"><i class="fa-solid fa-chart-pie"></i> Charts</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header>
            <h1>Customer Management</h1>
            <div class="user-profile">
                <i class="fa-solid fa-circle-user"></i> User: Admin
            </div>
        </header>

        <div class="content-grid">
            <!-- Add / Edit Customer Form -->
            <div class="panel">
                <h2 id="form-title"><i class="fa-solid fa-user-plus"></i> Add Customer</h2>
                <form id="customer-form" onsubmit="saveCustomer(event)">
                    <input type="hidden" id="editing-index" value="-1">

                    <div class="form-group">
                        <label>Customer Name</label>
                        <input type="text" id="cust-name" placeholder="e.g. Kasun Perera" required>
                    </div>

                    <div class="form-group">
                        <label>Customer Type</label>
                        <select id="cust-type">
                            <option value="Regular">Regular Customer</option>
                            <option value="Walk-in">Walk-in Customer</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Notes / Address (Optional)</label>
                        <textarea id="cust-notes" rows="3" placeholder="e.g. Preferred sizes or location"></textarea>
                    </div>

                    <button type="submit" id="btn-submit" class="btn-submit"><i class="fa-solid fa-save"></i> Save Customer</button>
                    <button type="button" id="btn-cancel" class="btn-cancel" style="display:none;" onclick="resetForm()">Cancel</button>
                </form>
            </div>

            <!-- Customer List Table -->
            <div class="panel">
                <div class="table-tools">
                    <h2><i class="fa-solid fa-address-book"></i> Customer Directory</h2>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Search by name or ID..." onkeyup="renderTable()">
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Customer Name</th>
                            <th>Type</th>
                            <th>Last Visit</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="customer-table-body">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Sample Default Data
        const defaultCustomers = [
            { id: 'CUST-001', name: 'Walk-in Customer', type: 'Walk-in', notes: 'Default cash customer', lastVisit: '2026-09-11' },
            { id: 'CUST-002', name: 'Nimal Silva', type: 'Regular', notes: 'Prefers Size 8 shoes', lastVisit: '2026-09-10' }
        ];

        function getCustomers() {
            let saved = localStorage.getItem('pos_customers');
            if (!saved) {
                localStorage.setItem('pos_customers', JSON.stringify(defaultCustomers));
                return defaultCustomers;
            }
            return JSON.parse(saved);
        }

        function renderTable() {
            const customers = getCustomers();
            const filterText = document.getElementById('search-input').value.toLowerCase();
            const tbody = document.getElementById('customer-table-body');
            tbody.innerHTML = '';

            customers.forEach((cust, index) => {
                const match = cust.name.toLowerCase().includes(filterText) || cust.id.toLowerCase().includes(filterText);

                if (match) {
                    const badgeClass = cust.type === 'Regular' ? 'badge-regular' : 'badge-walkin';
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${cust.id}</strong></td>
                            <td>${cust.name}</td>
                            <td><span class="badge ${badgeClass}">${cust.type}</span></td>
                            <td>${cust.lastVisit || 'N/A'}</td>
                            <td class="actions-cell">
                                <button class="btn-edit" onclick="editCustomer(${index})"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn-delete" onclick="deleteCustomer(${index})"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                }
            });
        }

        function saveCustomer(e) {
            e.preventDefault();
            const index = parseInt(document.getElementById('editing-index').value);
            const name = document.getElementById('cust-name').value.trim();
            const type = document.getElementById('cust-type').value;
            const notes = document.getElementById('cust-notes').value.trim();
            const today = new Date().toISOString().split('T')[0];

            let customers = getCustomers();

            if (index === -1) {
                const newId = 'CUST-' + String(customers.length + 1).padStart(3, '0');
                customers.push({ id: newId, name, type, notes, lastVisit: today });
            } else {
                customers[index].name = name;
                customers[index].type = type;
                customers[index].notes = notes;
            }

            localStorage.setItem('pos_customers', JSON.stringify(customers));
            resetForm();
            renderTable();
        }

        function editCustomer(index) {
            const customers = getCustomers();
            const cust = customers[index];

            document.getElementById('editing-index').value = index;
            document.getElementById('cust-name').value = cust.name;
            document.getElementById('cust-type').value = cust.type;
            document.getElementById('cust-notes').value = cust.notes || '';

            document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-user-pen"></i> Edit Customer';
            document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-rotate"></i> Update Customer';
            document.getElementById('btn-cancel').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('editing-index').value = -1;
            document.getElementById('customer-form').reset();
            document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-user-plus"></i> Add Customer';
            document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-save"></i> Save Customer';
            document.getElementById('btn-cancel').style.display = 'none';
        }

        function deleteCustomer(index) {
            if (confirm('Are you sure you want to delete this customer?')) {
                let customers = getCustomers();
                customers.splice(index, 1);
                localStorage.setItem('pos_customers', JSON.stringify(customers));
                renderTable();
            }
        }

        renderTable();
    </script>
</body>
</html>
