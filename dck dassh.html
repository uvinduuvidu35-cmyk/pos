<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCK POS - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #1a1c23; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; width: 100%; max-width: 400px; padding: 40px 30px; border-radius: 12px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .login-card h2 { color: #1a1c23; margin-bottom: 8px; font-size: 26px; }
        .login-card p { color: #777; margin-bottom: 30px; font-size: 14px; }
        .btn-google { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-google:hover { background: #f4f4f4; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>DCK POS</h2>
        <p>Sign in to access your POS System</p>
        <button class="btn-google" id="btn-google-login">
            <i class="fa-brands fa-google" style="color: #4285F4;"></i> Sign in with Google
        </button>
        <div id="error-message" class="error-msg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3xvmy4iXZ7B0ZbVjP2-ZoFuDcacg71F4",
            authDomain: "dck-29351.firebaseapp.com",
            projectId: "dck-29351",
            storageBucket: "dck-29351.firebasestorage.app",
            messagingSenderId: "577984877543",
            appId: "1:577984877543:web:91f6a221eb4f7c85a2e342",
            measurementId: "G-6YETC20HD3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // 🔒 Access ලබාදෙන Google Email ලිස්ට් එක මෙතනට දාන්න
        // ලිස්ට් එක හිස් නම් ([]) ඕනෑම Google Account එකකට Login විය හැක.
        const allowedEmails = [
            // "yourname@gmail.com"
        ];

        // කවුරුහරි දැනටමත් Log වෙලා ඉන්නවා නම් Direct Dashboard එකට යැවීම
        onAuthStateChanged(auth, (user) => {
            if (user && (allowedEmails.length === 0 || allowedEmails.includes(user.email))) {
                window.location.href = "dashboard.html";
            }
        });

        document.getElementById('btn-google-login').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    if (allowedEmails.length > 0 && !allowedEmails.includes(user.email)) {
                        document.getElementById('error-message').innerText = "Access Denied: Your email is not authorized.";
                        document.getElementById('error-message').style.display = "block";
                        auth.signOut();
                    } else {
                        window.location.href = "dashboard.html";
                    }
                })
                .catch((error) => {
                    console.error(error);
                    document.getElementById('error-message').innerText = "Login Failed! Try again.";
                    document.getElementById('error-message').style.display = "block";
                });
        });
    </script>
</body>
</html>
